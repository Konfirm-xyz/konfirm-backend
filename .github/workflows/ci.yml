name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  pull_request_target:
    branches: [main]

# Explicitly allow fork PRs to run workflows. When pull_request_target is used,
# this workflow will run in the context of the base repository with access to
# secrets, which is appropriate for public fork PRs that have been reviewed.
# For security: only run on pull_request events from trusted contributors or
# after manual approval. See GitHub Actions > General settings for fork PR policy.
permissions:
  contents: read
  checks: write

jobs:
  test:
    runs-on: ubuntu-latest

    # A real Postgres, not a mock — the same principle the test suite
    # itself follows (see README's Testing section).
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: konfirm_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/konfirm_test
      TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/konfirm_test
      JWT_SECRET: ci-only-secret-never-used-outside-this-workflow

    steps:
      - uses: actions/checkout@11d59607cc989b6c31a8b6f5ee0e3ad0e9a6b297 # v4
        with:
          # For pull_request_target events (fork PRs), checkout the PR's head commit
          # instead of the base branch. This ensures we test the actual fork code.
          ref: ${{ github.event_name == 'pull_request_target' && github.event.pull_request.head.sha || github.ref }}

      - uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5cb # v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Apply migrations to the test database
        run: npm run migrate:up

      - name: Type check
        run: npx tsc --noEmit -p .

      - name: Build
        run: npm run build

      # Fast suite: unit and e2e specs that only touch the local Postgres.
      # This gates the merge.
      - name: Run tests
        run: npm run test:fast

      # Live suite: the three specs that call the real Stellar testnet —
      # Horizon, Friendbot, and Soroban RPC (see jest.config.js). Real,
      # not mocked, but their pass/fail depends on testnet being up, which
      # a merge-blocking gate shouldn't depend on. Still runs on every
      # push, still visible in the log, just doesn't fail the build on a
      # testnet or Friendbot hiccup.
      - name: Run tests (live testnet)
        run: npm run test:live
        continue-on-error: true

      # A high-severity finding fails the build; moderate findings are
      # visible in the log without blocking every push on them.
      - name: Audit dependencies
        run: npm audit --omit=dev --audit-level=high
