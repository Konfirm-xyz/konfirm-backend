name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    # A real Postgres, not a mock — the same principle the test suite
    # itself follows (see README's Testing section).
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: konfirm_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/konfirm_test
      TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/konfirm_test
      JWT_SECRET: ci-only-secret-never-used-outside-this-workflow

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Apply migrations to the test database
        run: npm run migrate:up

      - name: Type check
        run: npx tsc --noEmit -p .

      # Fast suite: unit and e2e specs that only touch the local Postgres.
      # This gates the merge.
      - name: Run tests
        run: npm run test:fast

      # Live suite: the three specs that call the real Stellar testnet —
      # Horizon, Friendbot, and Soroban RPC (see jest.config.js). Real,
      # not mocked, but their pass/fail depends on testnet being up, which
      # a merge-blocking gate shouldn't depend on. Still runs on every
      # push, still visible in the log, just doesn't fail the build on a
      # testnet or Friendbot hiccup.
      - name: Run tests (live testnet)
        run: npm run test:live
        continue-on-error: true

      # A high-severity finding fails the build; moderate findings are
      # visible in the log without blocking every push on them.
      - name: Audit dependencies
        run: npm audit --audit-level=high
