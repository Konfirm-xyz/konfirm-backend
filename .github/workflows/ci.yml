name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# This workflow runs only on `pull_request` (and pushes to main), so it always
# executes in the context of the PR's own code with a read-only token and no
# secrets. It must never be switched to `pull_request_target`: that trigger runs
# in the base-repo context with secret access, and checking out PR-head code
# there would let a fork PR run arbitrary lifecycle scripts with those secrets
# (the "Pwn Request" pattern). Fork PRs from first-time contributors require
# maintainer approval before this workflow runs at all.
permissions:
  contents: read
  checks: write

jobs:
  # Path guard: this repo owns the backend only. A PR that adds or changes
  # files under a path owned by another repo (e.g. konfirm-frontend/) fails
  # here, before any build or test runs.
  path-guard:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' || github.event_name == 'pull_request_target'
    steps:
      - name: Reject changes to paths this repo does not own
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          # Paths owned by sibling repos, not by konfirm-backend.
          FORBIDDEN='^(konfirm-frontend|konfirm-contracts)/'
          git init -q .
          git remote add origin "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY"
          git fetch -q --no-tags --depth=1 origin "$BASE_SHA" "$HEAD_SHA"
          changed=$(git diff --name-only "$BASE_SHA" "$HEAD_SHA")
          echo "Changed files:"
          echo "$changed"
          offenders=$(echo "$changed" | grep -E "$FORBIDDEN" || true)
          if [ -n "$offenders" ]; then
            echo "::error::This PR touches paths konfirm-backend does not own:"
            echo "$offenders"
            exit 1
          fi

  test:
    runs-on: ubuntu-latest

    # A real Postgres, not a mock — the same principle the test suite
    # itself follows (see README's Testing section).
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: konfirm_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/konfirm_test
      TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/konfirm_test
      JWT_SECRET: ci-only-secret-never-used-outside-this-workflow

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4.2.2, verified via GitHub API against the real tag
        with:
          # Check out the PR's merge commit (pull_request event) or the pushed
          # commit. Never a fork head under a base-context trigger.
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0, verified via GitHub API against the real tag
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # Fails the build if two migration files share a numeric prefix, which
      # would make a fresh build's apply order differ from production's.
      - name: Check migration prefixes are unique
        run: npm run migrate:check

      - name: Apply migrations to the test database
        run: npm run migrate:up

      - name: Type check
        run: npx tsc --noEmit -p .

      # Fast suite: unit and e2e specs that only touch the local Postgres.
      # This gates the merge.
      - name: Run tests
        run: npm run test:fast

      # Live suite: the three specs that call the real Stellar testnet —
      # Horizon, Friendbot, and Soroban RPC (see jest.config.js). Real,
      # not mocked, but their pass/fail depends on testnet being up, which
      # a merge-blocking gate shouldn't depend on. Still runs on every
      # push, still visible in the log, just doesn't fail the build on a
      # testnet or Friendbot hiccup.
      - name: Run tests (live testnet)
        run: npm run test:live
        continue-on-error: true

      # Rust reconciler — "payment correctness's one source of truth"
      # (README) per this project's own stated invariant, yet this job never
      # built or ran it at all until now; its real unit/integration tests
      # (verdict.rs, store.rs, horizon.rs, compliance.rs, muxed.rs) existed
      # but had zero CI coverage. ubuntu-latest ships a Rust toolchain, so
      # no extra setup action is needed. A build failure always blocks —
      # code that doesn't compile is definitely broken. Test failures are
      # reported but don't block the merge, same reasoning as "Run tests
      # (live testnet)" above: several of these tests (horizon.rs order-book
      # rates, compliance.rs, store.rs db_tests) call the real Stellar
      # testnet or this job's own Postgres rather than being mocked.
      - name: Build reconciler (Rust)
        working-directory: reconciler
        run: cargo build --locked

      - name: Test reconciler (Rust)
        working-directory: reconciler
        run: cargo test --locked -- --include-ignored
        continue-on-error: true

      # A high-severity finding fails the build; moderate findings are
      # visible in the log without blocking every push on them.
      - name: Audit dependencies
        run: npm audit --omit=dev --audit-level=high
